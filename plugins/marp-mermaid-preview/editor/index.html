<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marp & Mermaid Preview</title>
  <link rel="stylesheet" href="editor.css">
  <style id="marp-style"></style>
</head>
<body>
  <div id="app">
    <!-- Top Action Toolbar -->
    <header class="toolbar">
      <div class="toolbar-group">
        <div class="brand-badge">
          <span class="icon">📊</span>
          <span>Marp & Mermaid</span>
        </div>

        <!-- Mode Switcher -->
        <div class="segmented-control">
          <button id="btn-mode-auto" class="active" title="依照 frontmatter 是否包含 marp: true 自動切換">自動</button>
          <button id="btn-mode-marp" title="強制以 Marp 投影片簡報模式呈現">簡報</button>
          <button id="btn-mode-doc" title="強制以標準 Markdown 文件模式呈現">文件</button>
        </div>
      </div>

      <!-- Slide Presentation Controls -->
      <div class="toolbar-group" id="slide-controls">
        <button id="btn-prev-slide" class="tool-btn" title="上一張投影片 (快捷鍵: ← / PgUp / Space+Shift)">◀</button>
        <span id="slide-counter" class="slide-counter">1 / 1</span>
        <button id="btn-next-slide" class="tool-btn" title="下一張投影片 (快捷鍵: → / PgDn / Space)">▶</button>

        <!-- Slide Layout -->
        <div class="segmented-control" style="margin-left: 6px;">
          <button id="btn-layout-single" class="active" title="單頁投影片居中顯示">單頁</button>
          <button id="btn-layout-continuous" title="連續垂直向下捲動顯示所有投影片">捲動</button>
        </div>

        <button id="btn-fullscreen" class="tool-btn" title="進入全螢幕簡報模式 (快捷鍵: F5 或 F)">⛶ 全螢幕</button>
      </div>

      <div class="toolbar-group">
        <span id="mermaid-badge" class="badge-info" style="display: none;">Mermaid: 0</span>

        <!-- Zoom Controls -->
        <div class="toolbar-group">
          <button id="btn-zoom-out" class="tool-btn" title="縮小 (Zoom Out)">-</button>
          <button id="btn-zoom-reset" class="tool-btn" style="min-width: 48px;" title="重設縮放">100%</button>
          <button id="btn-zoom-in" class="tool-btn" title="放大 (Zoom In)">+</button>
        </div>

        <!-- Print & Export -->
        <button id="btn-print" class="tool-btn" title="列印或另存為 PDF 文件">🖨️ 匯出 PDF</button>
      </div>
    </header>

    <!-- Main Viewport -->
    <main class="viewport" id="viewport">
      <!-- Marp Slides Output -->
      <div id="marp-container" class="mode-single"></div>

      <!-- Standard Markdown Output -->
      <div id="doc-container" class="markdown-body" style="display: none;"></div>
    </main>
  </div>

  <!-- Offline Bundled Scripts -->
  <script src="vendor/marp-core.bundle.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="editor.js"></script>
</body>
</html>
