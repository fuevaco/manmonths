<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資源中心</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-title">
        <span id="status-dot" class="status-dot" title="市集連線狀態"></span>
        <span>資源中心</span>
      </div>
      <div class="header-actions">
        <button id="btn-refresh" class="btn btn-icon hidden" title="重新整理目錄與連線" aria-label="重新整理目錄與連線">⟳</button>
      </div>
    </header>

    <div id="banner" class="banner hidden" role="status"></div>

    <section id="view-loading" class="content">
      <p class="muted">載入中…</p>
    </section>

    <!-- 登入 -->
    <section id="view-login" class="content hidden">
      <form id="login-form" class="panel-box" novalidate>
        <div class="panel-box-title">連線到資源市集</div>
        <div id="login-notice" class="notice hidden" role="alert"></div>
        <div class="field">
          <label for="in-url">市集網址</label>
          <input id="in-url" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://market.example.com">
          <div class="hint">輸入你有權使用的市集網址。</div>
        </div>
        <div class="field">
          <label for="in-user">帳號</label>
          <input id="in-user" type="text" autocomplete="username" spellcheck="false">
        </div>
        <div class="field">
          <label for="in-pass">密碼</label>
          <input id="in-pass" type="password" autocomplete="current-password">
        </div>
        <div id="login-error" class="error hidden" role="alert"></div>
        <button id="btn-login" type="submit" class="btn btn-primary btn-block">登入</button>
        <div class="hint">Orca 的登入與 LC-AI-Pack 桌面工具各自獨立；在這裡登入或登出不會影響另一邊。</div>
      </form>
    </section>

    <!-- 已登入 -->
    <section id="view-main" class="content hidden">
      <div class="panel-box">
        <div class="kv"><span class="muted">市集</span><span id="main-url" class="mono wrap"></span></div>
        <div class="kv"><span class="muted">帳號</span><span id="main-account"></span></div>
        <div id="client-versions" class="hint wrap"></div>
        <button id="btn-logout" class="btn btn-block">登出</button>
      </div>
      <section aria-label="資源包目錄" class="catalog">
        <div class="panel-box-title">全部資源包</div>
        <form id="catalog-form" class="panel-box">
          <div class="field">
            <label for="catalog-search">搜尋資源包</label>
            <input id="catalog-search" type="search" placeholder="名稱、識別碼或說明">
          </div>
          <div class="field">
            <label for="catalog-type">資源類型</label>
            <select id="catalog-type">
              <option value="">全部類型</option><option value="skill">Skills</option>
              <option value="agent">Agents</option><option value="mcp">MCP</option><option value="bundle">組合包</option>
            </select>
          </div>
          <div class="field"><label for="catalog-installation">安裝狀態</label><select id="catalog-installation"><option value="">全部</option><option value="installed">已安裝</option><option value="updates">可更新</option></select></div>
          <label class="checkbox"><input id="catalog-preview" type="checkbox">顯示 Preview 版本</label>
          <button class="btn btn-primary" type="submit">搜尋</button>
          <button id="catalog-clear" class="btn" type="button">清除篩選</button>
        </form>
        <div id="catalog-status" class="muted" role="status" aria-live="polite"></div>
        <button id="catalog-retry" class="btn hidden" type="button">重新讀取目錄</button>
        <ul id="catalog-list" class="catalog-list"></ul>
      </section>
    </section>
    <section id="view-details" class="content hidden">
      <button id="details-back" type="button" class="btn">返回清單</button>
      <h2 id="details-title" class="wrap"></h2>
      <p id="details-description" class="wrap"></p>
      <div class="panel-box">
        <label for="details-version">版本</label>
        <select id="details-version"></select>
        <p id="details-hosts" class="wrap"></p>
        <p id="details-changelog" class="wrap"></p>
        <label for="details-destination">ZIP 完整儲存路徑（選填）</label>
        <input id="details-destination" type="text" placeholder="留空存入使用者 Downloads 資料夾">
        <button id="details-download" type="button" class="btn btn-primary btn-block">下載 ZIP</button>
        <div id="details-status" class="wrap" role="status" aria-live="polite"></div>
        <button id="details-retry" type="button" class="btn hidden">重新讀取詳情</button>
      </div>
      <div id="details-installed" class="panel-box wrap"></div>
      <div id="install-box" class="panel-box">
        <div class="panel-box-title">安裝到 AI 工具</div>
        <div id="install-steps" class="install-steps">
        <label for="install-scope">1. 選擇安裝範圍</label>
        <select id="install-scope"><option value="global">使用者全域</option><option value="project">本機專案</option></select>
        <div id="install-project" class="field hidden">
          <label for="install-project-root">專案資料夾完整路徑</label>
          <input id="install-project-root" type="text" placeholder="輸入本機專案完整路徑">
          <button id="install-detect" type="button" class="btn btn-block">讀取專案目標</button>
        </div>
        <div id="install-target-label">2. 勾選部署目標</div>
        <div id="install-target" class="target-list" role="group" aria-labelledby="install-target-label"></div>
        <button id="details-update" type="button" class="btn btn-block hidden">更新所選目標</button>
        <div id="install-targets-status" class="hint wrap"></div>
        <button id="install-plan" type="button" class="btn btn-block">產生部署摘要</button>
        </div>
        <div id="install-summary" class="install-summary"></div>
        <div id="install-setup" class="install-summary hidden"></div>
        <button id="install-setup-save" type="button" class="btn btn-block hidden">儲存設定並重新產生摘要</button>
        <button id="install-confirm" type="button" class="btn btn-primary btn-block hidden">確認安裝</button>
        <button id="install-cancel" type="button" class="btn btn-block hidden">取消設定命令</button>
        <div id="install-status" class="wrap" role="status" aria-live="polite"></div>
        <div id="install-result" class="install-summary"></div>
        <button id="install-retry" type="button" class="btn btn-block hidden">只重試失敗的目標</button>
        <button id="install-done" type="button" class="btn btn-block hidden">完成</button>
      </div>
      <h3>使用說明</h3>
      <pre id="details-readme" class="wrap"></pre>
    </section>
  </div>
  <script src="panel.js"></script>
</body>
</html>
